---
- name: Deploy script and collect logs
  hosts: hosts
  tasks:
    - name: Copy script to host
      copy:
        src: ./scripts/script.sh
        dest: /home/ansible/script.sh
        mode: '0755'

    - name: Execute script
      shell: /home/ansible/script.sh > /home/ansible/output.log 2>&1
      
    - name: Fetch log from host
      fetch:
        src: /home/ansible/output.log
        dest: ./logs/{{ inventory_hostname }}_output.log
        flat: yes