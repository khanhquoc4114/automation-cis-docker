---
- name: Deploy script and collect logs
  hosts: hosts
  become: yes
  tasks:
    - name: Check if Docker is installed
      command: docker --version
      register: docker_check
      ignore_errors: yes

    - name: Install Docker prerequisites
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes
      when: docker_check.rc != 0

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
      when: docker_check.rc != 0

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
      when: docker_check.rc != 0

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes
      when: docker_check.rc != 0

    - name: Add ansible user to docker group
      user:
        name: ansible
        groups: docker
        append: yes
      when: docker_check.rc != 0

    - name: Copy script to host
      copy:
        src: ./scripts/script.sh
        dest: /home/ansible/script.sh
        mode: '0755'
      become_user: ansible

    - name: Execute script
      shell: /home/ansible/script.sh > /home/ansible/output.log 2>&1
      become_user: ansible
      
    - name: Fetch log from host
      fetch:
        src: /home/ansible/output.log
        dest: ./logs/{{ inventory_hostname }}_output.log
        flat: yes